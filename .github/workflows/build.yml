
name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: recon_app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow pytest

      - name: Run Tests
        run: python -m pytest tests -q
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Generate Icon
        run: python packaging/make_icon.py

      - name: Build Application
        run: |
          pyinstaller --noconfirm --clean --distpath dist --workpath build packaging/recon.spec

      - name: Install Inno Setup
        working-directory: .
        run: choco install innosetup -y --no-progress

      - name: Build Windows Installer
        working-directory: recon_app
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\installer.iss'

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: ReconPro-Windows
          path: recon_app/dist_installer/*.exe
          if-no-files-found: error
