name: Build Windows installer
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pyinstaller pillow
      - name: Tests
        run: python -m pytest tests -q
        env: { QT_QPA_PLATFORM: offscreen }
      - run: python packaging/make_icon.py
      - run: pyinstaller --noconfirm --clean --distpath dist --workpath build packaging/recon.spec
      - run: choco install innosetup -y --no-progress
      - run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: ReconPro-Windows
          path: dist_installer/*.exe
